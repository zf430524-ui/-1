<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>本地开发进度｜研学派团工作台</title>
  <link rel="stylesheet" href="/dev-progress.css">
</head>
<body>
  <main class="progress-shell">
    <header class="progress-header">
      <div><p class="eyebrow">仅限本地开发模式</p><h1>工作台开发进度</h1><p id="updated" class="muted">正在读取 tasks.md…</p></div>
      <div class="header-actions"><button id="refresh" type="button">刷新进度</button><a href="/">返回业务工作台</a></div>
    </header>
    <section id="summary" class="summary-grid" aria-label="任务汇总"></section>
    <section class="progress-panel current-panel">
      <div><span class="panel-label">当前下一项</span><strong id="next-task">—</strong></div>
      <div><span class="panel-label">最近检查</span><strong id="check-status">—</strong><small id="check-detail"></small></div>
    </section>
    <section class="progress-panel">
      <div class="section-heading"><div><span class="panel-label">阶段门禁</span><h2>从基础到可交付</h2></div><div id="gates" class="gate-list"></div></div>
    </section>
    <section class="progress-panel">
      <div class="section-heading table-heading">
        <div><span class="panel-label">T01—T30</span><h2>真实任务进度</h2></div>
        <label>筛选状态<select id="status-filter"><option value="">全部</option><option>IN_PROGRESS</option><option>REVIEW</option><option>TODO</option><option>BLOCKED</option><option>DONE</option></select></label>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>任务</th><th>状态</th><th>实际已完成</th><th>尚未完成</th><th>验收要求</th></tr></thead><tbody id="task-rows"></tbody></table>
      </div>
      <p id="empty" class="empty" hidden>没有符合条件的任务。</p>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <script type="module" src="/dev-progress.js"></script>
</body>
</html>
