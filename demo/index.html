<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研学团负责人工作台 v1 Demo</title>
<style>
/* =============================================
   研学团负责人工作台 - 全功能 Demo
   风格：运营指挥台（PRD D008 确认）
   技术：纯 HTML + CSS + JavaScript 单文件
   ============================================= */

:root {
  --bg: #f0f2f5;
  --sidebar-bg: #1a2a3a;
  --sidebar-hover: #243448;
  --sidebar-active: #2a7dd4;
  --card-bg: #ffffff;
  --primary: #2a9d8f;
  --primary-dark: #1e7d74;
  --danger: #e63946;
  --warning: #f4a261;
  --info: #457b9d;
  --text: #1a2a3a;
  --text-muted: #6c757d;
  --border: #dde1e7;
  --shadow: 0 2px 8px rgba(26,42,58,0.08);
  --radius: 8px;
  --sidebar-width: 220px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  height: 100vh;
  overflow: hidden;
}

/* === 整体布局 === */
.app-layout {
  display: flex;
  height: 100vh;
}

/* === 侧边导航 === */
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  color: #c8d6e5;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}

.sidebar-logo {
  padding: 20px 16px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.sidebar-logo h1 {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  line-height: 1.4;
}

.sidebar-logo span {
  font-size: 11px;
  color: #6b8cae;
}

.sidebar-nav { flex: 1; padding: 8px 0; }

.nav-section {
  margin-bottom: 4px;
}

.nav-section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #4a6a8a;
  padding: 10px 16px 4px;
  font-weight: 600;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  font-size: 13px;
  user-select: none;
}

.nav-item:hover { background: var(--sidebar-hover); color: #fff; }

.nav-item.active {
  background: rgba(42,125,212,0.15);
  border-left-color: var(--primary);
  color: #fff;
}

.nav-item .badge {
  margin-left: auto;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  background: var(--danger);
  color: #fff;
}

.nav-item .badge.warn { background: var(--warning); color: #1a2a3a; }
.nav-item .badge.ok { background: var(--primary); }

/* === 主内容区 === */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.main-header {
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.main-header h2 {
  font-size: 16px;
  font-weight: 600;
}

.header-status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--text-muted);
}

.header-status .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--primary);
  display: inline-block;
}

.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

/* === 页面通用组件 === */
.page-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* === 卡片 === */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.card-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-header h3 { font-size: 14px; font-weight: 600; }

.card-body { padding: 20px; }

/* === 指标卡 === */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  padding: 18px 20px;
  border-left: 4px solid var(--primary);
}

.stat-card.danger { border-left-color: var(--danger); }
.stat-card.warning { border-left-color: var(--warning); }
.stat-card.info { border-left-color: var(--info); }

.stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.stat-value { font-size: 28px; font-weight: 700; }
.stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* === 表格 === */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: #f7f9fc;
  padding: 10px 12px;
  text-align: left;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
tbody td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tbody tr:hover { background: #f7f9fc; }
tbody tr:last-child td { border-bottom: none; }

/* === 按钮 === */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  font-family: inherit;
  text-decoration: none;
}

.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* === 表单 === */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
.form-label .req { color: var(--danger); margin-left: 2px; }
.form-control {
  width: 100%;
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  transition: border-color 0.15s;
  background: #fff;
}
.form-control:focus { outline: none; border-color: var(--primary); }
.form-control.error { border-color: var(--danger); }
.form-control:disabled { background: #f7f9fc; color: var(--text-muted); }
select.form-control { cursor: pointer; }
textarea.form-control { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.form-error { font-size: 11px; color: var(--danger); margin-top: 4px; }

/* === 标签/状态 === */
.tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  gap: 4px;
}
.tag-primary { background: rgba(42,157,143,0.12); color: var(--primary); }
.tag-danger { background: rgba(230,57,70,0.12); color: var(--danger); }
.tag-warning { background: rgba(244,162,97,0.15); color: #c0620f; }
.tag-info { background: rgba(69,123,157,0.12); color: var(--info); }
.tag-gray { background: #f0f2f5; color: var(--text-muted); }

/* === 异常提示条 === */
.alert {
  padding: 12px 16px;
  border-radius: 6px;
  font-size: 13px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
}
.alert-danger { background: rgba(230,57,70,0.08); border: 1px solid rgba(230,57,70,0.25); color: #c01220; }
.alert-warning { background: rgba(244,162,97,0.1); border: 1px solid rgba(244,162,97,0.3); color: #8c4a0a; }
.alert-success { background: rgba(42,157,143,0.1); border: 1px solid rgba(42,157,143,0.25); color: #1a6b62; }
.alert-info { background: rgba(69,123,157,0.1); border: 1px solid rgba(69,123,157,0.25); color: var(--info); }

/* === 步骤条 === */
.step-bar {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
  background: #f0f2f5;
  border-radius: 8px;
  padding: 4px;
  overflow-x: auto;
}
.step-item {
  flex: 1;
  min-width: 80px;
  padding: 8px 12px;
  border-radius: 6px;
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.step-item.active { background: var(--primary); color: #fff; font-weight: 600; }
.step-item.done { background: var(--card-bg); color: var(--primary); border: 1px solid var(--primary); }
.step-item.warning { background: rgba(244,162,97,0.15); color: #c0620f; }
.step-item .step-num {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: currentColor;
  color: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  margin-right: 4px;
}

/* === Tabs === */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
  margin-bottom: 20px;
}
.tab-btn {
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.15s;
  font-family: inherit;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

/* === 模态框 === */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(26,42,58,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal {
  background: var(--card-bg);
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(26,42,58,0.2);
  max-width: 680px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-lg { max-width: 900px; }
.modal-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-body { padding: 20px 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}
.modal-close {
  background: none; border: none;
  font-size: 22px; cursor: pointer;
  color: var(--text-muted);
  line-height: 1;
}

/* === 空状态 === */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state p { font-size: 14px; margin-bottom: 16px; }

/* === 进度条 === */
.progress-wrap { margin-bottom: 16px; }
.progress-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
.progress-bar { height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 4px; background: var(--primary); transition: width 0.4s; }
.progress-fill.danger { background: var(--danger); }
.progress-fill.warning { background: var(--warning); }

/* === 项目卡片 === */
.project-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  padding: 16px 20px;
  cursor: pointer;
  transition: all 0.15s;
  border-left: 4px solid var(--primary);
}
.project-card:hover { box-shadow: 0 4px 16px rgba(26,42,58,0.12); transform: translateY(-1px); }
.project-card.warning { border-left-color: var(--warning); }
.project-card.danger { border-left-color: var(--danger); }
.project-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.project-card-title { font-size: 15px; font-weight: 600; }
.project-card-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 16px; flex-wrap: wrap; }

/* === 工具栏 === */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.toolbar-right { margin-left: auto; }
.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
}
.search-box input { border: none; outline: none; font-size: 13px; font-family: inherit; background: transparent; }
.search-box input::placeholder { color: var(--text-muted); }

/* === 详情侧栏 === */
.detail-section { margin-bottom: 24px; }
.detail-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.detail-item { }
.detail-item .label { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
.detail-item .value { font-size: 14px; font-weight: 500; }

/* === 交叉引用 === */
.ref-link { color: var(--primary); cursor: pointer; font-size: 12px; }
.ref-link:hover { text-decoration: underline; }

/* === 人员卡片 === */
.person-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: #f7f9fc;
  border-radius: 6px;
  border: 1px solid var(--border);
  margin-bottom: 8px;
}
.person-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  flex-shrink: 0;
}
.person-avatar.female { background: #e76f8a; }
.person-info { flex: 1; min-width: 0; }
.person-name { font-size: 14px; font-weight: 600; }
.person-meta { font-size: 12px; color: var(--text-muted); }
.person-actions { display: flex; gap: 6px; }

/* === 列表项 === */
.list-item {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.list-item:last-child { border-bottom: none; }

/* === 导出预览 === */
.export-preview {
  background: #f7f9fc;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
  font-size: 12px;
  font-family: 'Consolas', 'Courier New', monospace;
  overflow-x: auto;
  max-height: 300px;
  overflow-y: auto;
}

/* === 通知条 === */
.notif-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(42,157,143,0.1);
  border: 1px solid rgba(42,157,143,0.2);
  border-radius: 6px;
  font-size: 13px;
  color: #1a6b62;
  margin-bottom: 16px;
}

/* === 响应式 === */
@media (max-width: 1024px) {
  :root { --sidebar-width: 60px; }
  .sidebar-logo h1, .sidebar-logo span, .nav-section-title, .nav-item span { display: none; }
  .nav-item { justify-content: center; padding: 10px; }
  .nav-item .badge { display: none; }
  .form-row { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
}

/* === 辅助类 === */
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.mb-24 { margin-bottom: 24px; }
.mt-16 { margin-top: 16px; }
.flex { display: flex; }
.flex-1 { flex: 1; }
.items-center { align-items: center; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.text-muted { color: var(--text-muted); }
.text-danger { color: var(--danger); }
.text-success { color: var(--primary); }
.text-warning { color: var(--warning); }
.font-bold { font-weight: 700; }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.text-right { text-align: right; }
.w-full { width: 100%; }
.hidden { display: none !important; }
.overflow-x { overflow-x: auto; }
</style>
</head>

// 计算属性
function calcProjectStats(project) {
  const totalStudents = project.classes.reduce((s, c) => s + c.students, 0);
  const totalMale = project.classes.reduce((s, c) => s + c.male, 0);
  const totalFemale = project.classes.reduce((s, c) => s + c.female, 0);
  const totalTeachers = project.classes.reduce((s, c) => s + c.teachers.length, 0);
  const rideTeachers = project.classes.reduce((s, c) => s + c.teachers.filter(t => t.ride).length, 0);
  const totalGuides = project.assignedGuides.length;
  const totalDrivers = project.drivers.length;
  const tripDays = (new Date(project.endDate) - new Date(project.startDate)) / 86400000 + 1;
  const isMultiDay = tripDays > 1;

  let rideCount = 0, capacity = 0;
  if (project.drivers.length > 0) {
    project.drivers.forEach(d => {
      const cls = project.classes.find(c => c.id === d.classId);
      const rideStudents = cls ? cls.students : 0;
      const rideTea = cls ? cls.teachers.filter(t => t.ride).length : 0;
      const rideGuide = project.assignedGuides.filter(g => g.classId === d.classId).length;
      rideCount += rideStudents + rideTea + rideGuide;
      capacity += d.seats;
    });
  }

  return {
    totalStudents, totalMale, totalFemale, totalTeachers, rideTeachers,
    totalGuides, totalDrivers, tripDays, isMultiDay, rideCount, capacity
  };
}

function navigate(pageId) {
  currentPage = pageId;
  renderSidebar();
  renderHeader();
  renderPage();
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  let html = '';
  let currentSection = '';
  PAGES.forEach(p => {
    if (p.section !== currentSection) {
      currentSection = p.section;
      html += `<div class="nav-section-title">${currentSection}</div>`;
    }
    const badge = p.badge ? p.badge() : 0;
    const active = p.id === currentPage ? 'active' : '';
    const badgeHtml = badge > 0 ? `<span class="badge${badge > 0 ? '' : ''}">${badge}</span>` : '';
    html += `<div class="nav-item ${active}" onclick="navigate('${p.id}')">${p.icon}<span>${p.label}</span>${badgeHtml}</div>`;
  });
  nav.innerHTML = html;
}

function renderHeader() {
  const p = PAGES.find(p => p.id === currentPage);
  document.getElementById('headerTitleIcon').textContent = p ? p.icon : '🏠';
  document.getElementById('headerTitle').textContent = p ? p.label : '';
}

function renderPage() {
  const content = document.getElementById('mainContent');
  const fn = PAGE_RENDERERS[currentPage];
  content.innerHTML = fn ? fn() : '<div class="empty-state"><div class="icon">🚧</div><p>页面开发中...</p></div>';
  content.scrollTop = 0;
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
}

  /* ---------- P04 项目执行总览 ---------- */
  P04() {
    const p = currentProject;
    const s = calcProjectStats(p);
    const tripType = s.tripDays === 1 ? '一日游' : `多日游（${s.tripDays}天）`;
    const lodgingOk = !p.needLodging || p.rooms.length > 0;
    const mealOk = !p.needMeal || p.meals.length > 0;
    const guideOk = p.assignedGuides.length >= p.needGuides;
    const transportOk = p.drivers.length > 0;

    const steps = [
      { label: '基本信息', done: true, icon: '📋' },
      { label: '班级与老师', done: p.classes.length > 0, icon: '👥' },
      { label: '导游招募', done: guideOk, icon: '📢' },
      { label: '导游分配', done: guideOk, icon: '🎫' },
      { label: '乘车安排', done: transportOk, icon: '🚌', warn: !transportOk },
      { label: '住宿安排', done: lodgingOk, icon: '🏨', na: !p.needLodging, warn: p.needLodging && !lodgingOk },
      { label: '用餐安排', done: mealOk, icon: '🍽️', na: !p.needMeal, warn: p.needMeal && !mealOk },
      { label: '异常检查', done: getExceptionCount() === 0, icon: '🔍', warn: getExceptionCount() > 0 },
    ];

    return `
      <div class="flex items-center mb-24">
        <h1 class="page-title" style="margin-bottom:0">📊 项目执行总览</h1>
        <div style="margin-left:auto" class="flex gap-8">
          <span class="tag tag-${PROJECT_STATUS[p.status].color}">${PROJECT_STATUS[p.status].icon} ${PROJECT_STATUS[p.status].label}</span>
          <button class="btn btn-outline btn-sm" onclick="navigate('P03')">✏️ 编辑项目</button>
        </div>
      </div>

      <div class="card mb-24">
        <div class="card-body">
          <div class="detail-grid">
            <div class="detail-item"><div class="label">学校</div><div class="value font-bold">${p.school}</div></div>
            <div class="detail-item"><div class="label">年级</div><div class="value">${p.grade}</div></div>
            <div class="detail-item"><div class="label">目的地</div><div class="value">${p.dest}</div></div>
            <div class="detail-item"><div class="label">行程类型</div><div class="value">${tripType}</div></div>
            <div class="detail-item"><div class="label">出团日期</div><div class="value">${p.startDate}</div></div>
            <div class="detail-item"><div class="label">结束日期</div><div class="value">${p.endDate}</div></div>
            <div class="detail-item"><div class="label">集合地点</div><div class="value">${p.gather || '未设置'}</div></div>
            <div class="detail-item"><div class="label">集合时间</div><div class="value">${p.gatherTime || '未设置'}</div></div>
          </div>
        </div>
      </div>

      <div class="card mb-24">
        <div class="card-header"><h3>📋 执行阶段进度</h3></div>
        <div class="card-body">
          <div class="step-bar">
            ${steps.map((st, i) => `
              <div class="step-item ${st.na ? '' : (st.done ? 'done' : (st.warn ? 'warning' : ''))}"
                   onclick="${st.na ? '' : `navigate('${['P03','P05','P06','P07','P08','P09','P10','P18'][i]}')`}"
                   title="${st.na ? '不适用' : st.label}">
                <div style="font-size:16px">${st.icon}</div>
                <div style="margin-top:2px">${st.na ? `<span class="text-muted">${st.label}</span>` : st.label}</div>
                ${st.na ? '<div class="text-xs text-muted">不适用</div>' : (st.done ? '✓' : '')}
              </div>
            `).join('')}
          </div>

          <div class="stat-grid" style="margin-top:16px">
            <div class="stat-card">
              <div class="stat-label">学生总人数</div>
              <div class="stat-value">${s.totalStudents}</div>
              <div class="stat-sub">男 ${s.totalMale} / 女 ${s.totalFemale}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">班级数量</div>
              <div class="stat-value">${p.classes.length}</div>
              <div class="stat-sub">随车老师 ${s.rideTeachers} 人</div>
            </div>
            <div class="stat-card ${guideOk ? '' : 'warning'}">
              <div class="stat-label">已安排导游</div>
              <div class="stat-value">${p.assignedGuides.length}/${p.needGuides}</div>
              <div class="stat-sub">${guideOk ? '✅ 已齐备' : '⚠️ 缺' + (p.needGuides - p.assignedGuides.length) + '人'}</div>
            </div>
            <div class="stat-card ${transportOk ? '' : 'warning'}">
              <div class="stat-label">车辆安排</div>
              <div class="stat-value">${p.drivers.length}车</div>
              <div class="stat-sub">${transportOk ? `乘车${s.rideCount}人 / ${s.capacity}座` : '未安排'}</div>
            </div>
            ${p.needLodging ? `
            <div class="stat-card ${lodgingOk ? '' : 'warning'}">
              <div class="stat-label">住宿安排</div>
              <div class="stat-value">${p.rooms.length}间</div>
              <div class="stat-sub">${lodgingOk ? '✅ 已安排' : '未安排'}</div>
            </div>` : ''}
            ${p.needMeal ? `
            <div class="stat-card ${mealOk ? '' : 'warning'}">
              <div class="stat-label">用餐安排</div>
              <div class="stat-value">${p.meals.length}餐次</div>
              <div class="stat-sub">${mealOk ? '✅ 已安排' : '未安排'}</div>

      <div class="card">
        <div class="card-header"><h3>➡️ 下一步操作</h3></div>
        <div class="card-body">
          ${!guideOk ? `
            <div class="notif-bar">👥 导游尚未安排齐备 — <span class="ref-link" onclick="navigate('P07')">去安排导游 →</span></div>
          ` : !transportOk ? `
            <div class="notif-bar">🚌 乘车安排未完成 — <span class="ref-link" onclick="navigate('P08')">去安排车辆 →</span></div>
          ` : p.needLodging && !lodgingOk ? `
            <div class="notif-bar">🏨 住宿安排未完成 — <span class="ref-link" onclick="navigate('P09')">去安排住宿 →</span></div>
          ` : p.needMeal && !mealOk ? `
            <div class="notif-bar">🍽️ 用餐安排未完成 — <span class="ref-link" onclick="navigate('P10')">去安排用餐 →</span></div>
          ` : getExceptionCount() > 0 ? `
            <div class="notif-bar">⚠️ 存在 ${getExceptionCount()} 个异常 — <span class="ref-link" onclick="navigate('P18')">去处理异常 →</span></div>
          ` : `
            <div class="notif-bar" style="background:rgba(42,157,143,0.1);color:#1a6b62;border-color:rgba(42,157,143,0.2)">
              ✅ 所有模块已完成安排，可以进入最终检查并导出表格
              <button class="btn btn-primary btn-sm" onclick="navigate('P16')" style="margin-left:12px">📑 进入表格中心 →</button>
            </div>
          `}
          <div class="flex gap-8 mt-16">
            <button class="btn btn-outline btn-sm" onclick="navigate('P05')">👥 班级与随团汇总</button>
            <button class="btn btn-outline btn-sm" onclick="navigate('P07')">🎫 导游安排</button>
            <button class="btn btn-outline btn-sm" onclick="navigate('P08')">🚌 乘车安排</button>
            ${p.needLodging ? `<button class="btn btn-outline btn-sm" onclick="navigate('P09')">🏨 住宿安排</button>` : ''}
            ${p.needMeal ? `<button class="btn btn-outline btn-sm" onclick="navigate('P10')">🍽️ 用餐安排</button>` : ''}
          </div>
        </div>
      </div>
    `;
  },

  /* ---------- P05 班级、老师与随团汇总 ---------- */

      const gg = mockData.guides.find(x => x.id === g.guideId);

    const mDrivers = p.drivers.filter(d => d.gender === '男').length;

                  <th>女生</th>

                  <td>${s.totalMale}</td>
                  <td>${s.totalFemale}</td>
                  <td>—</td>
                  <td>—</td>
                  <td>${s.rideTeachers}</td>

          </div>

              <thead><tr><th>姓名</th><th>性别</th><th>联系电话</th><th>随车</th><th>住宿</th><th>就餐</th><th>所属班级</th></tr></thead>

          ${unassigned.map(g => `
            <div class="person-card">

                <div class="person-meta">📞 ${g.phone} · 导游证 ${g.certNo} · 带团 ${g.tours}次</div>

              <div class="person-actions">
                <button class="btn btn-primary btn-sm" onclick="assignGuide('${g.id}')">分配到班级</button>

  /* ---------- P08 乘车安排 ---------- */
  P08() {
    const p = currentProject;
    const s = calcProjectStats(p);
    const totalRiders = s.rideCount;
    const totalSeats = s.capacity;
    const totalEmpty = totalSeats - totalRiders;

    return `
      <div class="flex items-center mb-24">
        <h1 class="page-title" style="margin-bottom:0">🚌 乘车安排</h1>

        </div>
      </div>

      ${totalEmpty < 0 ? `<div class="alert alert-danger mb-16">🔴 超载！乘车人数 ${totalRiders} 超过可用座位 ${totalSeats}，超出 ${-totalEmpty} 人，必须调整</div>` : ''}

      <div class="card mb-24">
        <div class="card-header">
          <h3>🚐 车辆安排表</h3>
          <div style="margin-left:auto;font-size:12px;color:var(--text-muted)">
            乘车 ${totalRiders} 人 / ${totalSeats} 座 · 空位 ${totalEmpty} · 合计 ${p.drivers.length} 车
          </div>
        </div>
        <div class="card-body">
          ${p.drivers.length === 0 ? '<div class="empty-state"><div class="icon">🚌</div><p>暂无乘车安排</p></div>' : ''}
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>车号</th><th>车牌</th><th>车型</th><th>座位</th><th>分配班级</th><th>学生</th><th>老师</th><th>导游</th><th>乘车人数</th><th>空位</th><th>司机</th><th>状态</th><th>操作</th></tr>
              </thead>
              <tbody>
                ${p.drivers.map((d, i) => {
                  const cls = p.classes.find(c => c.id === d.classId);
                  const rideStudents = cls ? cls.students : 0;
                  const rideTea = cls ? cls.teachers.filter(t => t.ride).length : 0;
                  const rideGuide = p.assignedGuides.filter(g => g.classId === d.classId).length;
                  const rideCount = rideStudents + rideTea + rideGuide;
                  const empty = d.seats - rideCount;
                  const over = empty < 0;
                  return `
                    <tr class="${over ? 'text-danger' : ''}">
                      <td><strong>${i+1}号车</strong></td>
                      <td>${d.carNo}</td>
                      <td>${d.carModel}</td>
                      <td>${d.seats}</td>
                      <td>${cls ? cls.name : '—'}</td>
                      <td>${rideStudents}</td>
                      <td>${rideTea}</td>
                      <td>${rideGuide}</td>
                      <td><strong>${rideCount}</strong></td>
                      <td class="${over ? 'text-danger font-bold' : 'text-success'}">${empty}</td>
                      <td>${d.name}<br><span class="text-xs text-muted">${d.phone}</span></td>
                      <td>${over ? '<span class="tag tag-danger">超载</span>' : '<span class="tag tag-primary">正常</span>'}</td>
                      <td><button class="btn btn-outline btn-sm" onclick="openModal('editCar',${i})">编辑</button></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
              <tfoot>
                <tr style="background:#f7f9fc;font-weight:600">
                  <td>合计</td><td></td><td></td><td>${totalSeats}</td><td></td>
                  <td>${s.totalStudents}</td><td>${s.rideTeachers}</td><td>${s.totalGuides}</td>
                  <td>${totalRiders}</td>
                  <td class="${totalEmpty < 0 ? 'text-danger' : 'text-success'}">${totalEmpty}</td>
                  <td></td><td></td><td></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3>📐 自动安排建议规则</h3></div>
        <div class="card-body">
          <ol style="padding-left:20px;font-size:13px;color:var(--text-muted);line-height:2">
            <li>一班一车优先，尽量不拆班</li>
            <li>班级按顺序安排车辆</li>
            <li>在不超载的前提下减少座位浪费</li>
            <li>同一学校尽量使用同一车队</li>
            <li>人工调整后立即重新校验</li>
          </ol>
          <div class="notif-bar" style="margin-top:12px">
            💡 当前：${p.classes.length}个班，${p.drivers.length}辆车，${p.assignedGuides.length}名导游。自动建议已按规则分配。
          </div>
        </div>
      </div>
    `;
  },

  /* ---------- P09 住宿安排 ---------- */
  P09() {
    const p = currentProject;
    if (!p.needLodging) return `<div class="empty-state"><div class="icon">🏨</div><p>本项目为一日游，无需住宿安排</p><button class="btn btn-outline" onclick="navigate('P04')">← 返回项目总览</button></div>`;

    const s = calcProjectStats(p);

    const totalCapacity = p.rooms.reduce((sum, r) => sum + r.capacity, 0);
    const totalAssigned = p.rooms.reduce((sum, r) => sum + r.count, 0);
    const emptyBeds = totalCapacity - totalAssigned;
    const maleRooms = p.rooms.filter(r => r.gender === '男');
    const femaleRooms = p.rooms.filter(r => r.gender === '女');

    return `
      <div class="flex items-center mb-24">
        <h1 class="page-title" style="margin-bottom:0">🏨 住宿安排</h1>

        <div class="stat-card">
          <div class="stat-label">已安排房间</div>
          <div class="stat-value">${p.rooms.length}间</div>

        <div class="stat-card ${emptyBeds >= 0 ? '' : 'danger'}">

      <div class="card mb-24">
        <div class="card-header"><h3>🛏️ 分房明细</h3></div>

          <div class="table-wrap">
            <table>
              <thead><tr><th>酒店</th><th>楼栋</th><th>楼层</th><th>房号</th><th>房型</th><th>容量</th><th>分配班级/角色</th><th>性别</th><th>安排人数</th><th>状态</th></tr></thead>
              <tbody>
                ${p.rooms.map(r => {
                  const over = r.count > r.capacity;
                  const cls = p.classes.find(c => c.id === r.classId);
                  return `
                    <tr class="${over ? 'text-danger' : ''}">
                      <td>${r.hotel}</td>
                      <td>${r.building}</td>
                      <td>${r.floor}</td>
                      <td><strong>${r.roomNo}</strong></td>
                      <td>${r.type}</td>
                      <td>${r.capacity}</td>
                      <td>${cls ? cls.name : r.role}</td>
                      <td>${r.gender}</td>
                      <td><strong>${r.count}</strong></td>
                      <td>${over ? '<span class="tag tag-danger">超员</span>' : '<span class="tag tag-primary">正常</span>'}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3>📐 分房规则说明</h3></div>
        <div class="card-body">
          <ol style="padding-left:20px;font-size:13px;color:var(--text-muted);line-height:2">

            <li>同班优先集中，房间号尽量连续</li>

            <li>剩余少量学生可跨班拼房，记录主班、拼入班、双方人数和原因</li>
            <li>导游、老师、司机集中安排，继续遵守性别和容量限制</li>
          </ol>
        </div>
      </div>
    `;
  },

  /* ---------- P10 用餐安排 ---------- */
  P10() {
    const p = currentProject;
    if (!p.needMeal) return `<div class="empty-state"><div class="icon">🍽️</div><p>本项目不含餐，无需用餐安排</p><button class="btn btn-outline" onclick="navigate('P04')">← 返回项目总览</button></div>`;

    const s = calcProjectStats(p);
    const mealCount = s.totalStudents + s.totalGuides + s.totalTeachers + s.totalDrivers;
    const baseMeal = s.totalStudents + s.totalGuides; // 学生+导游
    const suggestedTables = Math.ceil(baseMeal / 10);

    return `
      <div class="flex items-center mb-24">
        <h1 class="page-title" style="margin-bottom:0">🍽️ 用餐安排</h1>
        <div style="margin-left:auto" class="flex gap-8">

          <button class="btn btn-primary btn-sm" onclick="openModal('addMeal')">➕ 添加餐次</button>
        </div>
      </div>

      <div class="stat-grid mb-24">
        <div class="stat-card">
          <div class="stat-label">每餐就餐人数</div>
          <div class="stat-value">${mealCount}</div>
          <div class="stat-sub">学生${s.totalStudents} + 导游${s.totalGuides} + 老师${s.totalTeachers} + 司机${s.totalDrivers}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">学生+导游基础建议桌数</div>
          <div class="stat-value">${suggestedTables}桌</div>
          <div class="stat-sub">按每桌10人计算，${baseMeal}人</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">已安排餐次</div>
          <div class="stat-value">${p.meals.length}</div>
          <div class="stat-sub">含 ${p.mealCount} 个餐次</div>
        </div>
      </div>

      <div class="card mb-24">
        <div class="card-header"><h3>🍽️ 餐次安排明细</h3></div>
        <div class="card-body">
          ${p.meals.length === 0 ? '<div class="empty-state"><div class="icon">🍽️</div><p>暂无用餐安排</p></div>' : ''}
          ${p.meals.map((m, i) => {
            const capacity = m.booked * m.standard;
            const surplus = capacity - mealCount;
            return `
              <div style="background:#f7f9fc;border-radius:8px;padding:16px;margin-bottom:12px;border:1px solid var(--border)">
                <div class="flex items-center gap-8 mb-12">
                  <strong>${m.date} ${m.meal}</strong>
                  <span class="tag tag-info">${m.restaurant}</span>
                  <span class="tag tag-primary">${m.time}</span>
                </div>
                <div class="detail-grid">
                  <div class="detail-item"><div class="label">标准桌人数</div><div class="value">${m.standard}人/桌</div></div>
                  <div class="detail-item"><div class="label">预订桌数</div><div class="value">${m.booked}桌</div></div>
                  <div class="detail-item"><div class="label">总容量</div><div class="value">${capacity}人</div></div>
                  <div class="detail-item"><div class="label">就餐人数</div><div class="value">${mealCount}人</div></div>
                  <div class="detail-item"><div class="label">余位</div><div class="value ${surplus >= 0 ? 'text-success' : 'text-danger'}">${surplus >= 0 ? surplus + '位' : '不足' + (-surplus) + '位'}</div></div>
                </div>
                <div class="text-xs text-muted mt-16">桌号：${m.tables.join('、')}</div>
              </div>

      <div class="card">
        <div class="card-header"><h3>📐 用餐安排规则</h3></div>
        <div class="card-body">
          <ol style="padding-left:20px;font-size:13px;color:var(--text-muted);line-height:2">

            <li>老师、司机等从项目随团人员汇总单列，由负责人人工追加桌数</li>
            <li>班级按顺序集中就座，同班桌号尽量连续</li>
            <li>不足一桌时可与后一班拼桌，标明各班人数</li>
            <li>每餐每个桌号唯一，多家餐厅分别记录</li>
          </ol>
        </div>
      </div>
    `;
  },

function selectProject(id) {

function saveProject() {
  const school = document.getElementById('f-school').value;

  if (!school || !grade) {
    document.getElementById('saveMsg').innerHTML = '<div class="alert alert-danger">请填写必填字段</div>';
    return;

  document.getElementById('saveMsg').innerHTML = '<div class="alert alert-success">✅ 项目草稿已保存！</div>';

function filterProjects(keyword) {
  const list = document.getElementById('projectList');
  if (!list) return;
  const cards = list.querySelectorAll('.project-card');
  cards.forEach(card => {
    card.style.display = card.textContent.includes(keyword) ? '' : 'none';
  });
}

function filterByStatus(status) {
  const list = document.getElementById('projectList');
  if (!list) return;
  const cards = list.querySelectorAll('.project-card');
  cards.forEach(card => {
    card.style.display = !status || card.textContent.includes(PROJECT_STATUS[status]?.label || '') ? '' : 'none';
  });
}

function filterGuides(keyword) {
  // guide filtering - simple text match on table
  const rows = document.querySelectorAll('tbody tr');
  rows.forEach(row => {
    row.style.display = !keyword || row.textContent.includes(keyword) ? '' : 'none';
  });
}

function switchTab(btn, tabId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('[id^="tab-"]').forEach(t => t.classList.add('hidden'));
  const el = document.getElementById(tabId);
  if (el) el.classList.remove('hidden');
}

function generateNotice() {
  const p = currentProject;
  const start = document.getElementById('n-start')?.value || p.startDate;
  const count = document.getElementById('n-count')?.value || p.needGuides;
  const showSchool = document.getElementById('n-showSchool')?.checked;
  const showGrade = document.getElementById('n-showGrade')?.checked;
  const school = showSchool ? p.school : '某学校';
  const grade = showGrade ? p.grade : '某年级';

  const notice = `【研学导游招募】\n\n${school} ${grade}研学团招募${count}名导游。\n出团日期：${start}\n目的地：${p.dest}\n集合地点：${p.gather || '待定'} · ${p.gatherTime || '待定'}\n\n招募要求：\n1. 持有有效期内的导游证\n2. 近30天内无临近出团退团记录\n3. 合作状态正常\n\n请按接龙格式报名：序号 · 姓名 · 手机号\n报名截止：${start}前3天`;

  document.getElementById('noticeResult').innerHTML = `
    <div class="card">
      <div class="card-body">
        <pre style="font-family:monospace;font-size:13px;white-space:pre-wrap">${notice}</pre>

      </div>
    </div>
  `;
}

function processSignup() {
  const text = document.getElementById('signupText').value;
  if (!text.trim()) return;

  const lines = text.trim().split('\n');
  let html = '<div class="card"><div class="card-body"><div class="table-wrap"><table><thead><tr><th>#</th><th>识别姓名</th><th>手机号</th><th>匹配结果</th><th>导游证状态</th><th>操作</th></tr></thead><tbody>';

  lines.forEach((line, i) => {
    const match = line.match(/(?:\d+[.、]\s*)?([^\s\d][^\n]*?)[\s\n]+(\d{3}[\*\*]+\d{4})/);
    const gName = line.match(/([^\d\s][^\n]*?)(?=\s+\d)/)?.[1] || line.match(/[^\d]+/)?.[0].trim() || '';
    const found = mockData.guides.find(g => line.includes(g.name));

    if (found) {
      html += `<tr>
        <td>${i+1}</td>
        <td>${found.name}</td>
        <td>${found.phone}</td>
        <td><span class="tag tag-primary">✅ 已匹配：${found.name}</span></td>
        <td><span class="tag tag-${found.certStatus === 'valid' ? 'primary' : 'danger'}">${found.certStatus === 'valid' ? '有效' : '异常'}</span></td>
        <td><button class="btn btn-primary btn-sm" onclick="assignGuide('${found.id}')">安排到班级</button></td>
      </tr>`;
    } else {
      html += `<tr>
        <td>${i+1}</td>
        <td>${gName || '—'}</td>
        <td>—</td>
        <td><span class="tag tag-warning">⚠️ 未找到匹配导游</span></td>
        <td>—</td>
        <td><button class="btn btn-outline btn-sm">人工确认</button></td>
      </tr>`;
    }
  });

  html += '</tbody></table></div></div></div>';
  document.getElementById('signupResult').innerHTML = html;
}

function assignGuide(guideId) {
  const p = currentProject;
  const cls = p.classes.find(c => !p.assignedGuides.some(g => g.classId === c.id));
  if (!cls) { alert('所有班级已分配导游！'); return; }
  const gg = mockData.guides.find(g => g.id === guideId);
  if (!gg) return;
  p.assignedGuides.push({ guideId, name: gg.name, classId: cls.id, status: 'assigned' });
  renderPage();
  alert(`${gg.name} 已安排至 ${cls.name}`);
}

function removeGuide(guideId) {
  const p = currentProject;
  const idx = p.assignedGuides.findIndex(g => g.guideId === guideId);
  if (idx > -1) {
    const name = p.assignedGuides[idx].name;
    p.assignedGuides.splice(idx, 1);
    renderPage();
    alert(`${name} 已移出安排`);
  }
}

  const text = btn.getAttribute('data-text') || btn.previousElementSibling?.textContent || '';

    const orig = btn.textContent;
    btn.textContent = '✅ 已复制！';

  });

            <div class="form-group"><label class="form-label">班主任</label><input class="form-control" id="mc-teacher" value="${cls.teachers[0]?.name || ''}"></div>
            <div class="form-group"><label class="form-label">班主任电话</label><input class="form-control" id="mc-teacher-phone" value="${cls.teachers[0]?.phone || ''}"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="doSaveClass('${cls.id}')">💾 保存</button>
        </div>
      </div>
    </div>`;
  }

  else if (type === 'addCar') {
    html = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header"><h3>➕ 添加车辆</h3>${closeBtn}</div>
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group"><label class="form-label">车牌号 <span class="req">*</span></label><input class="form-control" id="mc-carno" placeholder="如：湘A12345"></div>
            <div class="form-group"><label class="form-label">车型</label><input class="form-control" id="mc-carmodel" placeholder="如：49座大巴"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">座位数</label><input type="number" class="form-control" id="mc-seats" value="49" min="1"></div>
            <div class="form-group"><label class="form-label">分配班级</label>
              <select class="form-control" id="mc-classid">
                ${currentProject.classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">司机姓名</label><input class="form-control" id="mc-drivername" placeholder="司机姓名"></div>
            <div class="form-group"><label class="form-label">司机电话</label><input class="form-control" id="mc-driverphone" placeholder="手机号"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="doAddCar()">💾 添加</button>
        </div>
      </div>
    </div>`;
  }

  else if (type === 'guideDetail') {
    const g = mockData.guides.find(x => x.id === param) || mockData.guides[0];
    html = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header"><h3>👤 导游详情：${g.name}</h3>${closeBtn}</div>
        <div class="modal-body">
          <div class="detail-grid mb-16">
            <div class="detail-item"><div class="label">姓名</div><div class="value font-bold">${g.name}</div></div>
            <div class="detail-item"><div class="label">性别</div><div class="value">${g.gender}</div></div>
            <div class="detail-item"><div class="label">电话</div><div class="value">${g.phone}</div></div>
            <div class="detail-item"><div class="label">合作状态</div><div class="value"><span class="tag tag-${g.status === 'active' ? 'primary' : 'gray'}">${g.status === 'active' ? '合作中' : '停用'}</span></div></div>
            <div class="detail-item"><div class="label">导游证号</div><div class="value">${g.certNo}</div></div>
            <div class="detail-item"><div class="label">证件有效期</div><div class="value">${g.certExpiry}</div></div>
            <div class="detail-item"><div class="label">带团次数</div><div class="value">${g.tours}次</div></div>
            <div class="detail-item"><div class="label">好评率</div><div class="value">⭐ ${g.rating}</div></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeModal()">关闭</button>
          <button class="btn btn-primary" onclick="assignGuide('${g.id}');closeModal()">分配到班级</button>
        </div>
      </div>
    </div>`;
  }

  else if (type === 'addSchool') {
    html = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header"><h3>➕ 新增学校</h3>${closeBtn}</div>
        <div class="modal-body">
          <div class="form-group"><label class="form-label">学校名称 <span class="req">*</span></label><input class="form-control" id="ms-name" placeholder="学校全称"></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">常用联系人</label><input class="form-control" id="ms-contact"></div>
            <div class="form-group"><label class="form-label">联系电话</label><input class="form-control" id="ms-phone"></div>
          </div>
          <div class="form-group"><label class="form-label">合作备注</label><textarea class="form-control" id="ms-note"></textarea></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="doAddSchool()">💾 保存</button>
        </div>
      </div>
    </div>`;
  }

  else if (type === 'addGuide') {
    html = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header"><h3>➕ 新增导游</h3>${closeBtn}</div>
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group"><label class="form-label">姓名 <span class="req">*</span></label><input class="form-control" id="mg-name"></div>
            <div class="form-group"><label class="form-label">性别</label>
              <select class="form-control" id="mg-gender"><option>男</option><option>女</option></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">电话</label><input class="form-control" id="mg-phone"></div>
            <div class="form-group"><label class="form-label">导游证号</label><input class="form-control" id="mg-certno"></div>
          </div>
          <div class="form-group"><label class="form-label">证件有效期</label><input type="date" class="form-control" id="mg-cert-expiry"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="doAddGuide()">💾 保存</button>
        </div>
      </div>
    </div>`;
  }

  root.innerHTML = html;
}

function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
}

function doAddClass() {
  const name = document.getElementById('mc-name').value;
  const total = parseInt(document.getElementById('mc-total').value) || 0;
  const male = parseInt(document.getElementById('mc-male').value) || 0;
  const female = parseInt(document.getElementById('mc-female').value) || 0;
  const teacher = document.getElementById('mc-teacher').value;
  const phone = document.getElementById('mc-teacher-phone').value;
  const needGuide = parseInt(document.getElementById('mc-needGuide')?.value) || 1;

  if (!name || !total) { alert('请填写必填字段'); return; }
  if (male + female !== total) {
    if (!confirm(`男${male} + 女${female} = ${male+female}，不等于总人数${total}，是否继续？`)) return;
  }

  const newClass = {
    id: 'C' + (currentProject.classes.length + 1 + Date.now() % 1000),
    name, students: total, male, female,
    teachers: teacher ? [{ name: teacher, phone, gender: '待定', ride: true, lodging: currentProject.needLodging, meal: currentProject.needMeal }] : [],
    needGuide
  };
  currentProject.classes.push(newClass);
  currentProject.needGuides += needGuide;
  closeModal();
  renderPage();
}

function doSaveClass(clsId) {
  const cls = currentProject.classes.find(c => c.id === clsId);
  if (!cls) return;
  cls.name = document.getElementById('mc-name').value;
  cls.students = parseInt(document.getElementById('mc-total').value) || 0;
  cls.male = parseInt(document.getElementById('mc-male').value) || 0;
  cls.female = parseInt(document.getElementById('mc-female').value) || 0;
  if (cls.teachers[0]) cls.teachers[0].name = document.getElementById('mc-teacher').value;
  closeModal();
  renderPage();
}

function doAddCar() {
  const carNo = document.getElementById('mc-carno').value;
  if (!carNo) { alert('请填写车牌号'); return; }
  const newDriver = {
    id: 'D' + (currentProject.drivers.length + 1),
    name: document.getElementById('mc-drivername').value || '待定司机',
    phone: document.getElementById('mc-driverphone').value || '****',
    gender: '男',
    carNo,
    carModel: document.getElementById('mc-carmodel').value || '大巴',
    seats: parseInt(document.getElementById('mc-seats').value) || 49,
    classId: document.getElementById('mc-classid').value,
    ride: true, lodging: currentProject.needLodging, meal: currentProject.needMeal,
  };
  currentProject.drivers.push(newDriver);
  closeModal();
  renderPage();
}

function doAddSchool() {
  const name = document.getElementById('ms-name').value;
  if (!name) { alert('请填写学校名称'); return; }
  const newSchool = {
    id: 'S' + (mockData.schools.length + 1 + Date.now() % 100).toString().padStart(3, '0'),
    name,
    contact: document.getElementById('ms-contact').value,
    phone: document.getElementById('ms-phone').value,
    note: document.getElementById('ms-note').value,
    status: 'active'
  };
  mockData.schools.push(newSchool);
  closeModal();
  renderPage();
}

function doAddGuide() {
  const name = document.getElementById('mg-name').value;
  if (!name) { alert('请填写姓名'); return; }
  const newGuide = {
    id: 'G' + (mockData.guides.length + 1 + Date.now() % 100).toString().padStart(3, '0'),
    name,
    phone: document.getElementById('mg-phone').value || '****',
    gender: document.getElementById('mg-gender').value,
    certNo: document.getElementById('mg-certno').value || '待补',
    certExpiry: document.getElementById('mg-cert-expiry').value || '',
    status: 'active',
    certStatus: 'valid',
    tours: 0,
    rating: 0
  };
  mockData.guides.push(newGuide);
  closeModal();
  renderPage();
}

function useSchool(schoolId) {
  navigate('P03');
}

function showImportOptions() {
  const type = document.getElementById('importType')?.value;
  const excel = document.getElementById('excelUploadSection');
  const text = document.getElementById('textImportSection');
  if (excel) excel.classList.toggle('hidden', type !== 'class' && type !== 'transport' && type !== 'lodging' && type !== 'meal' && type !== 'school' && type !== 'guide');
  if (text) text.classList.toggle('hidden', type !== 'signup');
}

function parseFile() {
  document.getElementById('parseResult').innerHTML = '<div class="alert alert-info">📋 模拟解析完成，共3条记录。请在下一步确认映射。</div>';
}

function parseText() {
  document.getElementById('parseResult').innerHTML = '<div class="alert alert-info">📋 模拟解析完成，请确认匹配结果。</div>';
}

function confirmImport() {
  alert('✅ 数据已成功写入正式数据！（Demo 模拟）');
}

/* =============================================
   初始化
   ============================================= */

document.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  renderHeader();
  renderPage();
});
</script>
